{% extends 'base.html' %}

{% block title %} Form {% endblock %}

{% block content %}
    <h1 style="margin: 10px 0px 10px 0px;">Add new user: </h1>
    
    <!-- Add new person form -->
    <form action="/form" method="POST">
        <div>
            <input type="text" name="name" placeholder="Ime" autocomplete="off" required>
            <input type="text" name="surname" placeholder="Prezime" autocomplete="off" required>
        </div>
        <div>
            <button type="submit" class="add_user_btn">Dodaj novu osobu</button>
        </div>
    </form>

    <h1>Popis osoba u bazi:</h1>
    <ul>
        {% for person in persons %}
            <li>
                <div class="list-each-person-box"><p style="margin: 0;">{{ person.id }}. {{ person.name }} {{ person.surname }}</p>

                <!-- Forma za brisanje koja šalje ID osobe u rutu -->
                <form class="btn-delete-form" action="{{ url_for('main.delete_person', person_id=person.id) }}" method="POST">
                    
                    <button type="submit" class="btn-delete" onclick="return confirm('Jeste li sigurni da želite obrisati ovu osobu?')">
                        Obriši
                    </button>
                </form>
                </div>
            </li>
        {% else %}
            <li style="color: red;">Nema unesenih osoba.</li>
        {% endfor %}
    </ul>
{% endblock %}
